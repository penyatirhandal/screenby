name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
      NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
      NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
      NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
      # Only point Gradle at a release keystore when all signing secrets exist.
      NEXUS_KEYSTORE_FILE: ${{ secrets.NEXUS_KEYSTORE_BASE64 != '' && secrets.NEXUS_KEYSTORE_PASSWORD != '' && secrets.NEXUS_KEY_ALIAS != '' && secrets.NEXUS_KEY_PASSWORD != '' && 'nexus-release.keystore' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-lock-screen-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare debug release asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/NexusLockScreen-debug.apk

      - name: Decode release keystore
        if: ${{ env.NEXUS_KEYSTORE_BASE64 != '' && env.NEXUS_KEYSTORE_PASSWORD != '' && env.NEXUS_KEY_ALIAS != '' && env.NEXUS_KEY_PASSWORD != '' }}
        run: |
          echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > android/app/nexus-release.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-lock-screen-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/NexusLockScreen-release.apk

      - name: Publish APK to GitHub Release
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-debug
          name: Nexus Lock Screen - Latest Build
          body: |
            APK otomatis dari commit `${{ github.sha }}`.

            - Build: GitHub Actions run `${{ github.run_id }}`
            - `NexusLockScreen-release.apk`: APK release standalone, disarankan untuk dipasang.
            - `NexusLockScreen-debug.apk`: APK debug, memerlukan Metro (`adb reverse tcp:8081 tcp:8081`).

            Release ditandatangani dengan keystore rilis jika keempat secrets keystore tersedia;
            jika tidak, build memakai debug keystore.
          prerelease: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: release-assets/*.apk
