name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
      NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
      NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
      NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-lock-screen-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ env.NEXUS_KEYSTORE_BASE64 != '' && env.NEXUS_KEYSTORE_PASSWORD != '' && env.NEXUS_KEY_ALIAS != '' && env.NEXUS_KEY_PASSWORD != '' }}
        run: |
          echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > android/app/nexus-release.keystore

      - name: Build signed release APK
        if: ${{ env.NEXUS_KEYSTORE_BASE64 != '' && env.NEXUS_KEYSTORE_PASSWORD != '' && env.NEXUS_KEY_ALIAS != '' && env.NEXUS_KEY_PASSWORD != '' }}
        working-directory: android
        env:
          NEXUS_KEYSTORE_FILE: nexus-release.keystore
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        if: ${{ env.NEXUS_KEYSTORE_BASE64 != '' && env.NEXUS_KEYSTORE_PASSWORD != '' && env.NEXUS_KEY_ALIAS != '' && env.NEXUS_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexus-lock-screen-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
